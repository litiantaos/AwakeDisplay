name: Build and Release

on:
  push:
    branches:
      - main # 每次推送到 main 分支时触发
    tags:
      - 'v*' # 每次推送带 v 的 tag 时触发

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest
    permissions:
      contents: write # 给流水线赋予写入 Releases 的权限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build App
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package App
        run: |
          zip -r AwakeDisplay.zip AwakeDisplay.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AwakeDisplay-macOS
          path: AwakeDisplay.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: AwakeDisplay.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}